<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente del salón - COCO-SSD</title>
    <link rel="stylesheet" href="style.css" />

    <!-- TensorFlow.js (versión fija: los backends deben coincidir con el core) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <!-- Backend WebGPU opcional (WebGL y CPU ya vienen en tf.min.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script>
    <!-- Modelo pre-entrenado COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Asistente del salón</h1>
        <p class="subtitle">Detección de objetos en tiempo real con COCO-SSD</p>
      </div>
      <p id="status" role="status">Cargando el modelo COCO-SSD…</p>
    </header>

    <main class="layout">
      <section class="main">
        <div class="card controls">
          <button id="btnStart" disabled>Activar webcam</button>

          <div class="field">
            <label for="backend">Backend</label>
            <select id="backend">
              <option value="webgpu">webgpu</option>
              <option value="webgl">webgl</option>
              <option value="cpu">cpu</option>
            </select>
          </div>

          <div class="field grow">
            <label for="threshold">Umbral de confianza: <span id="thresholdValue">0.50</span></label>
            <input id="threshold" type="range" min="0.2" max="0.9" step="0.05" value="0.5" />
          </div>
        </div>

        <div class="camView">
          <p class="camPlaceholder">Activa la webcam para empezar</p>
          <video id="webcam" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>

        <div class="stats">
          <div class="card stat">
            <span class="statLabel">Backend</span>
            <span class="statValue" id="statBackend">-</span>
          </div>
          <div class="card stat">
            <span class="statLabel">FPS</span>
            <span class="statValue" id="statFps">-</span>
          </div>
          <div class="card stat">
            <span class="statLabel">detect()</span>
            <span class="statValue" id="statDetect">-</span>
          </div>
          <div class="card stat">
            <span class="statLabel">Brillo</span>
            <span class="statValue" id="statBrightness">-</span>
          </div>
        </div>
      </section>

      <aside class="panel">
        <section class="card">
          <h2>Avisos</h2>
          <ul id="alerts"><li class="empty">Sin avisos</li></ul>
        </section>

        <section class="card">
          <h2>Mando</h2>
          <p id="remoteState">Aún no se ha visto</p>
        </section>

        <section class="card">
          <h2>Objetos detectados</h2>
          <ul id="objects"><li class="empty">Nada todavía</li></ul>
        </section>
      </aside>
    </main>

    <script src="index.js"></script>
  </body>
</html>
